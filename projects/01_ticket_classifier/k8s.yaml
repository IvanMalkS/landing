apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-classifier-deployment
  labels:
    app: ticket-classifier
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ticket-classifier
  template:
    metadata:
      labels:
        app: ticket-classifier
    spec:
      containers:
      - name: ticket-classifier
        image: ticket-classifier:latest
        ports:
        - containerPort: 8000
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ticket-classifier-service
spec:
  type: ClusterIP
  selector:
    app: ticket-classifier
  ports:
  - port: 80
    targetPort: 8000
