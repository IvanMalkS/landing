[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-monorepo"
version = "0.1.0"
description = "ML projects monorepo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "statsmodels",
    "scikit-learn",
    "lightgbm",
    "catboost",
    "torch",
    "faiss-cpu",
    "qdrant-client",
    "fastapi",
    "httpx",
    "uvicorn",
    "onnx",
    "onnxruntime",
    "implicit",
    "spacy",
    "pydantic",
    "pyyaml",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-m 'not slow'"
testpaths = ["tests"]
pythonpath = [".", "projects"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
